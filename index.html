<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2ece6" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Summerflow — Scrapbook Side Objects Prototype</title>
  <link rel="stylesheet" href="./styles.css?v=mobile-patch-v24" />

  <style id="mobile-decoration-v24">
    @media (max-width:700px){
      .star{opacity:.82!important;width:clamp(14px,4.9vw,24px)!important}
      .star.small{width:clamp(11px,3.6vw,18px)!important}
      .star.tiny{width:clamp(7px,2vw,10px)!important}
      .star.large{width:clamp(24px,7vw,34px)!important}

      .s01,.s03,.s05,.s07,.s10,.s12,.s14,.s16,.s18,.s20,.s23,.s25,.s26,.s27{display:block!important}
      .s02,.s04,.s06,.s08,.s09,.s11,.s13,.s15,.s17,.s19,.s21,.s22,.s24{display:none!important}

      .s01{left:4%!important;right:auto!important;top:12svh!important;bottom:auto!important}
      .s03{left:11%!important;right:auto!important;top:30svh!important;bottom:auto!important}
      .s05{right:11%!important;left:auto!important;top:15svh!important;bottom:auto!important}
      .s07{right:4%!important;left:auto!important;top:34svh!important;bottom:auto!important}
      .s10{right:7%!important;left:auto!important;top:48svh!important;bottom:auto!important}
      .s12{left:7%!important;right:auto!important;top:52svh!important;bottom:auto!important}
      .s14{right:12%!important;left:auto!important;top:63svh!important;bottom:auto!important}
      .s16{left:11%!important;right:auto!important;top:68svh!important;bottom:auto!important}
      .s18{left:38%!important;right:auto!important;top:76svh!important;bottom:auto!important}
      .s20{right:14%!important;left:auto!important;top:88svh!important;bottom:auto!important}
      .s23{left:10%!important;right:auto!important;top:92svh!important;bottom:auto!important}
      .s25{right:8%!important;left:auto!important;top:82svh!important;bottom:auto!important}
      .s26{right:3%!important;left:auto!important;top:72svh!important;bottom:auto!important}
      .s27{left:5%!important;right:auto!important;top:72svh!important;bottom:auto!important}

      .scrap-poster{left:6vw!important;right:auto!important;top:150px!important;bottom:auto!important;width:clamp(60px,16vw,70px)!important;opacity:.98!important}
      .scrap-polpic{right:6vw!important;left:auto!important;top:190px!important;bottom:auto!important;width:clamp(58px,15.5vw,68px)!important;opacity:.98!important}
      .scrap-postit{left:5vw!important;right:auto!important;top:475px!important;bottom:auto!important;width:clamp(72px,18.5vw,88px)!important;opacity:.97!important}
      .scrap-memo{right:5vw!important;left:auto!important;top:505px!important;bottom:auto!important;width:clamp(72px,18vw,86px)!important;opacity:.97!important}
    }

    @media (max-width:430px){
      .scrap-poster{top:142px!important}
      .scrap-polpic{top:182px!important}
      .scrap-postit{top:455px!important;width:clamp(68px,17.8vw,80px)!important}
      .scrap-memo{top:485px!important;width:clamp(68px,17.5vw,80px)!important}
    }
  </style>
</head>
<body data-build="24">
  <main class="home" aria-label="Summerflow composition prototype">
    <div class="star-field" aria-hidden="true">
      <i class="star s01"></i><i class="star s02 tiny"></i><i class="star s03 small"></i>
      <i class="star s04 large"></i><i class="star s05 tiny"></i><i class="star s06"></i>
      <i class="star s07 small"></i><i class="star s08 tiny"></i><i class="star s09 large"></i>
      <i class="star s10"></i><i class="star s11 tiny"></i><i class="star s12 small"></i>
      <i class="star s13 tiny"></i><i class="star s14"></i><i class="star s15 large"></i>
      <i class="star s16 small"></i><i class="star s17 tiny"></i><i class="star s18"></i>
      <i class="star s19 tiny"></i><i class="star s20 small"></i><i class="star s21 large"></i>
      <i class="star s22"></i><i class="star s23 tiny"></i><i class="star s24 small"></i>
      <i class="star s25 tiny"></i><i class="star s26"></i><i class="star s27 small"></i>
    </div>

    <div class="scrapbook-layer" aria-label="Summerflow scrapbook decorations">
      <button class="scrap scrap-poster" type="button" data-message="summer is a state of mind ♡" aria-label="Summer Flow poster">
        <img src="./assets/scrapbook/SF_poster.png" alt="" draggable="false" />
        <span class="scrap-note" aria-hidden="true">summer is a state of mind ♡</span>
      </button>
      <button class="scrap scrap-postit" type="button" data-message="just let it flow" aria-label="Heart memo">
        <img src="./assets/scrapbook/SF_Postit.png" alt="" draggable="false" />
        <span class="scrap-note" aria-hidden="true">just let it flow</span>
      </button>
      <button class="scrap scrap-polpic" type="button" data-message="tiny summer memory" aria-label="Heart polaroid">
        <img src="./assets/scrapbook/SF_Polpic.png" alt="" draggable="false" />
        <span class="scrap-note" aria-hidden="true">tiny summer memory</span>
      </button>
      <button class="scrap scrap-memo" type="button" data-message="today: good music + iced latte" aria-label="Today memo">
        <img src="./assets/scrapbook/SF_Memo.png" alt="" draggable="false" />
        <span class="scrap-note" aria-hidden="true">good music + iced latte</span>
      </button>
    </div>

    <section class="stage" aria-label="Retro phone and interactive keyring navigation">
      <div class="page-logo" aria-label="Summerflow">
        <img src="./assets/logo-web/logo.png" alt="Summerflow" draggable="false" />
      </div>

      <div class="phone" aria-label="Summerflow retro candybar phone">
        <img class="phone-frame phone-shell" src="./assets/web/phone-boot-01.png" alt="" draggable="false" />
        <div class="lcd-screen" aria-hidden="true">
          <img class="lcd-pixel-logo" src="./assets/logo-web/logo-pixel.png" alt="" draggable="false" />
          <i class="lcd-scanline"></i>
        </div>
        <div class="phone-controls" aria-label="Phone logo navigation">
          <button class="phone-hit hit-next-pad" type="button" data-action="next" aria-label="Next pixel logo"></button>
        </div>
      </div>

      <div class="main-ring" aria-hidden="true">
        <img src="./assets/web/main-ring.png" alt="" draggable="false" />
      </div>

      <svg class="rope-layer" aria-hidden="true">
        <g class="rope rope-a"><path class="rope-shadow"></path><path class="rope-base"></path><path class="rope-beads"></path></g>
        <g class="rope rope-b"><path class="rope-shadow"></path><path class="rope-base"></path><path class="rope-beads"></path></g>
        <g class="rope rope-c"><path class="rope-shadow"></path><path class="rope-base"></path><path class="rope-beads"></path></g>
        <g class="rope rope-d"><path class="rope-shadow"></path><path class="rope-base"></path><path class="rope-beads"></path></g>
        <g class="rope rope-e"><path class="rope-shadow"></path><path class="rope-base"></path><path class="rope-beads"></path></g>
      </svg>

      <button class="charm charm-camera" type="button" data-destination="Lookbook" data-label="LOOKBOOK" aria-label="Camera, Lookbook"><img src="./assets/web/camera.png" alt="" draggable="false" /></button>
      <button class="charm charm-cd" type="button" data-destination="Playlist" data-label="PLAYLIST" aria-label="CD, Playlist"><img src="./assets/web/cd.png" alt="" draggable="false" /></button>
      <button class="charm charm-diary" type="button" data-destination="About / Story" data-label="STORY" aria-label="Diary, About / Story"><img src="./assets/web/diary.png" alt="" draggable="false" /></button>
      <button class="charm charm-hanger" type="button" data-destination="Clothes / Closet" data-label="CLOSET" aria-label="Hanger, Clothes / Closet"><img src="./assets/web/hanger.png" alt="" draggable="false" /></button>
      <button class="charm charm-envelope" type="button" data-destination="Order" data-label="ORDER" aria-label="Envelope, Order"><img src="./assets/web/envelope.png" alt="" draggable="false" /></button>
    </section>

    <section class="destination-view" aria-live="polite" aria-hidden="true">
      <div class="destination-card">
        <button class="home-button" type="button" aria-label="Back to Summerflow home">← HOME</button>
        <p class="destination-kicker">COMPOSITION + BOOT CHECK / <span data-view-kicker>DISCOVERY</span></p>
        <div class="destination-icon" data-view-icon aria-hidden="true">♡</div>
        <h1 data-view-title>LOOKBOOK</h1>
        <p class="destination-copy" data-view-copy>placeholder content</p>
        <p class="destination-note">content comes in 03</p>
      </div>
    </section>

    <footer class="site-footer" aria-label="Copyright">
      <p>©2026 Summerflow. All rights reserved.</p>
    </footer>
  </main>

  <script>
    (() => {
      const current = document.body.dataset.build || '';
      fetch(`./build-version.json?t=${Date.now()}`, { cache: 'no-store' })
        .then((response) => response.ok ? response.json() : null)
        .then((data) => {
          const latest = data && String(data.version || '');
          if (!latest || latest === current) return;
          const url = new URL(window.location.href);
          if (url.searchParams.get('build') === latest) return;
          url.searchParams.set('build', latest);
          window.location.replace(url.toString());
        })
        .catch(() => {});
    })();
  </script>
  <script src="./script.js?v=mobile-patch-v24"></script>
  <script src="./phone-buttons.js?v=mobile-patch-v24"></script>
  <script src="./scrapbook.js?v=mobile-patch-v24"></script>
</body>
</html>
